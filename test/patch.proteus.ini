; Profile stopping the game's music with a code patch (a cheat code) instead of muting channels
[song]
memory   = system_ram
address  = 0x42
size     = 1
debounce = 1
unmapped = original

[patch]
othercore = not=this
testcore  = music=off

[mix]
crossfade_ms = 0

[tracks]
1 = original
2 = tone_220.wav
3 = tone_330.ogg
4 = silence
5 = tone_550.mp3 | volume=100

[debug]
log_songs = 1
