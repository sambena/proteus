; Profile for stopping the game's own music with a RAM request instead of muting it
[song]
memory   = system_ram
address  = 0x61
size     = 1
debounce = 1
unmapped = original

[silence]
address  = 0x60
value    = 0x80

[mix]
crossfade_ms = 0

[tracks]
1 = original
2 = tone_220.wav
3 = tone_330.ogg
4 = silence
5 = tone_550.mp3 | volume=100

[debug]
log_songs = 1
