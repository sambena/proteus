; Profile for an N64-style game: the song is a sequence player's, and RAM writes held while
; replacing silence that player (Ocarina of Time: its volume scale, applied on a recalculate flag)
[song]
byte_order = n64
memory     = system_ram
address    = 0x80000081
active     = 0x80000080 & 0x80
stopped    = original
debounce   = 1
unmapped   = original

[hold]
0x80000084 = 00000000
0x80000080 |= 04

[mix]
crossfade_ms = 0

[tracks]
1 = original
2 = tone_220.wav
3 = tone_330.ogg
4 = silence
5 = tone_550.mp3

[debug]
log_songs = 1
