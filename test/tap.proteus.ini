; Profile following a tap: the game reports every sound it requests (song + 1) at 0x63, so songs
; are read there, and unmapped requests (sound effects) leave the music alone
[song]
address  = 0x63
debounce = 1
latch    = 1
unmapped = keep

[tap]
othercore = not=this
testcore  = tap=on

[patch]
testcore  = music=off

[mix]
crossfade_ms = 0

[tracks]
2 = original
3 = tone_220.wav
4 = tone_330.ogg
5 = silence
6 = tone_550.mp3
10 = original
7 = tone_220.wav
